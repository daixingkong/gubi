<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞机大战</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; overflow: hidden;
  font-family: 'Microsoft YaHei', sans-serif;
}
canvas { display: block; cursor: none; }
#ui {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 16px 24px; pointer-events: none;
  color: #fff; font-size: 18px;
}
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  pointer-events: none;
}
#overlay.hidden { display: none; }
#overlay h1 { font-size: 56px; color: #ffcc00; text-shadow: 0 0 20px #ff6600; margin-bottom: 20px; }
#overlay p { font-size: 20px; color: #ccc; margin-bottom: 30px; }
#overlay button {
  pointer-events: all; padding: 12px 40px; font-size: 20px;
  background: #ff6600; color: #fff; border: none; border-radius: 8px;
  cursor: pointer; transition: transform 0.1s;
}
#overlay button:hover { transform: scale(1.1); }
#overlay button:active { transform: scale(0.95); }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="ui">
  <div>❤️ <span id="lives">3</span></div>
  <div>分数: <span id="score">0</span></div>
  <div>最高: <span id="high">0</span></div>
</div>
<div id="overlay">
  <h1>🛩️ 飞机大战</h1>
  <p>移动鼠标控制飞机，自动发射子弹</p>
  <button id="startBtn">开始游戏</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const elScore = document.getElementById('score');
const elHigh = document.getElementById('high');
const elLives = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let highScore = parseInt(localStorage.getItem('planeWarHigh')) || 0;
elHigh.textContent = highScore;

let player, bullets, enemies, explosions, stars;
let score, lives, gameRunning, mouseX, mouseY;
let frameCount = 0;

class Player {
  constructor() {
    this.w = 50; this.h = 56;
    this.x = W / 2 - this.w / 2;
    this.y = H - 120;
    this.invincible = 0;
  }
  update() {
    const targetX = mouseX - this.w / 2;
    const targetY = mouseY - this.h / 2;
    this.x += (targetX - this.x) * 0.12;
    this.y += (targetY - this.y) * 0.12;
    this.x = Math.max(0, Math.min(W - this.w, this.x));
    this.y = Math.max(0, Math.min(H - this.h, this.y));
    if (this.invincible > 0) this.invincible--;
  }
  draw() {
    if (this.invincible > 0 && Math.floor(this.invincible / 5) % 2 === 0) return;
    const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    ctx.save(); ctx.translate(cx, cy);
    // body
    ctx.fillStyle = '#2196F3';
    ctx.beginPath();
    ctx.moveTo(0, -28);
    ctx.lineTo(-18, 10); ctx.lineTo(-25, 28); ctx.lineTo(-18, 20);
    ctx.lineTo(0, 24); ctx.lineTo(18, 20); ctx.lineTo(25, 28);
    ctx.lineTo(18, 10); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#64B5F6'; ctx.lineWidth = 2; ctx.stroke();
    // cockpit
    ctx.fillStyle = '#B3E5FC';
    ctx.beginPath(); ctx.ellipse(0, -8, 8, 14, 0, 0, Math.PI * 2); ctx.fill();
    // wings accent
    ctx.fillStyle = '#1976D2';
    ctx.beginPath(); ctx.moveTo(-20, 12); ctx.lineTo(-8, 6); ctx.lineTo(-8, 18); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20, 12); ctx.lineTo(8, 6); ctx.lineTo(8, 18); ctx.closePath(); ctx.fill();
    // engine glow
    ctx.fillStyle = '#FF9800';
    ctx.beginPath(); ctx.arc(0, 26, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFEB3B';
    ctx.beginPath(); ctx.arc(0, 26, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  shoot() {
    bullets.push(new Bullet(this.x + this.w / 2 - 3, this.y - 10, -12));
    bullets.push(new Bullet(this.x + this.w / 2 + 1, this.y - 10, -12));
  }
}

class Bullet {
  constructor(x, y, vy) { this.x = x; this.y = y; this.w = 4; this.h = 14; this.vy = vy; }
  update() { this.y += this.vy; }
  draw() {
    const grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
    grad.addColorStop(0, '#FFEB3B'); grad.addColorStop(1, '#FF9800');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.roundRect(this.x, this.y, this.w, this.h, 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.roundRect(this.x + 0.5, this.y + 2, this.w - 1, 5, 1.5); ctx.fill();
  }
}

class Enemy {
  constructor(type) {
    this.type = type; // 'small' | 'medium' | 'large'
    if (type === 'small') { this.w = 36; this.h = 40; this.hp = 1; this.speed = 3 + Math.random() * 3; }
    else if (type === 'medium') { this.w = 50; this.h = 56; this.hp = 3; this.speed = 1.5 + Math.random() * 2; }
    else { this.w = 70; this.h = 78; this.hp = 8; this.speed = 1 + Math.random(); }
    this.x = Math.random() * (W - this.w);
    this.y = -this.h - Math.random() * 200;
    this.flash = 0;
  }
  update() {
    this.y += this.speed;
    if (this.type === 'medium') this.x += Math.sin(frameCount * 0.05 + this.y * 0.02) * 1;
    if (this.flash > 0) this.flash--;
  }
  draw() {
    const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
    ctx.save(); ctx.translate(cx, cy);
    if (this.flash > 0) { ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.7; }
    if (this.type === 'small') {
      ctx.fillStyle = '#E53935';
      ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(-14, -8); ctx.lineTo(-18, -20);
      ctx.lineTo(-12, -12); ctx.lineTo(0, -18); ctx.lineTo(12, -12);
      ctx.lineTo(18, -20); ctx.lineTo(14, -8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#FFCDD2';
      ctx.beginPath(); ctx.ellipse(0, 5, 6, 8, 0, 0, Math.PI * 2); ctx.fill();
    } else if (this.type === 'medium') {
      ctx.fillStyle = '#FF6F00';
      ctx.beginPath(); ctx.moveTo(0, 28); ctx.lineTo(-20, -6); ctx.lineTo(-25, -28);
      ctx.lineTo(-16, -16); ctx.lineTo(0, -26); ctx.lineTo(16, -16);
      ctx.lineTo(25, -28); ctx.lineTo(20, -6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#FFE0B2';
      ctx.beginPath(); ctx.ellipse(0, 8, 10, 12, 0, 0, Math.PI * 2); ctx.fill();
      // wing guns
      ctx.fillStyle = '#BF360C';
      ctx.beginPath(); ctx.arc(-18, 0, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(18, 0, 4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#7B1FA2';
      ctx.beginPath(); ctx.moveTo(0, 39); ctx.lineTo(-28, -8); ctx.lineTo(-35, -39);
      ctx.lineTo(-22, -22); ctx.lineTo(0, -36); ctx.lineTo(22, -22);
      ctx.lineTo(35, -39); ctx.lineTo(28, -8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#E1BEE7';
      ctx.beginPath(); ctx.ellipse(0, 10, 14, 16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4A148C';
      ctx.beginPath(); ctx.arc(-22, -4, 6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(22, -4, 6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // hp bar for medium/large
    if (this.type !== 'small') {
      const barW = this.w, barH = 4;
      ctx.fillStyle = '#333';
      ctx.fillRect(this.x, this.y - 10, barW, barH);
      const maxHp = this.type === 'medium' ? 3 : 8;
      ctx.fillStyle = '#4CAF50';
      ctx.fillRect(this.x, this.y - 10, barW * (this.hp / maxHp), barH);
    }
  }
}

class Explosion {
  constructor(x, y, size) {
    this.x = x; this.y = y; this.size = size; this.frame = 0; this.maxFrame = 20;
    this.particles = [];
    for (let i = 0; i < size * 2; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * size * 0.3;
      this.particles.push({ x: 0, y: 0, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: 1 + Math.random() * 3, color: ['#FF9800','#FF5722','#FFEB3B','#F44336'][Math.floor(Math.random() * 4)] });
    }
  }
  update() { this.frame++; for (const p of this.particles) { p.x += p.vx; p.y += p.vy; p.r *= 0.94; } }
  draw() {
    const alpha = 1 - this.frame / this.maxFrame;
    ctx.globalAlpha = alpha;
    for (const p of this.particles) {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(this.x + p.x, this.y + p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  get dead() { return this.frame >= this.maxFrame; }
}

class Star {
  constructor() { this.reset(true); }
  reset(init) {
    this.y = init ? Math.random() * H : -2;
    this.x = Math.random() * W;
    this.speed = 0.5 + Math.random() * 2;
    this.r = Math.random() * 1.5;
    this.bright = Math.random() * 0.5 + 0.5;
  }
  update() { this.y += this.speed; if (this.y > H + 2) this.reset(false); }
  draw() { ctx.fillStyle = `rgba(255,255,255,${this.bright})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill(); }
}

function init() {
  player = new Player();
  bullets = [];
  enemies = [];
  explosions = [];
  stars = Array.from({ length: 80 }, () => new Star());
  score = 0; lives = 3;
  elScore.textContent = '0'; elLives.textContent = '3';
}

function shootBullet() {
  if (frameCount % 5 === 0) {
    bullets.push(new Bullet(mouseX - 5, player.y + 8, -16));
  }
}

function spawnEnemy() {
  const r = Math.random();
  if (r < 0.6) enemies.push(new Enemy('small'));
  else if (r < 0.85) enemies.push(new Enemy('medium'));
  else enemies.push(new Enemy('large'));
}

function checkCollision(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
  frameCount++;

  // stars
  for (const s of stars) { s.update(); }

  // player
  player.update();
  if (player.invincible > 0) player.invincible--;

  // auto shoot
  if (frameCount % 6 === 0) player.shoot();

  // bullets
  for (const b of bullets) b.update();
  bullets = bullets.filter(b => b.y > -20 && b.y < H + 20);

  // enemy spawn
  const spawnRate = Math.max(20, 50 - Math.floor(score / 100));
  if (frameCount % spawnRate === 0) spawnEnemy();

  // enemies
  for (const e of enemies) e.update();

  // bullet-enemy collision
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      if (checkCollision(bullets[bi], enemies[ei])) {
        enemies[ei].hp--;
        enemies[ei].flash = 3;
        bullets.splice(bi, 1);
        if (enemies[ei].hp <= 0) {
          const pts = enemies[ei].type === 'small' ? 10 : enemies[ei].type === 'medium' ? 30 : 80;
          score += pts;
          elScore.textContent = score;
          explosions.push(new Explosion(enemies[ei].x + enemies[ei].w / 2, enemies[ei].y + enemies[ei].h / 2, enemies[ei].w / 4));
          enemies.splice(ei, 1);
        }
        break;
      }
    }
  }

  // player-enemy collision
  if (player.invincible === 0) {
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      if (checkCollision(player, enemies[ei])) {
        explosions.push(new Explosion(enemies[ei].x + enemies[ei].w / 2, enemies[ei].y + enemies[ei].h / 2, enemies[ei].w / 4));
        enemies.splice(ei, 1);
        lives--;
        elLives.textContent = lives;
        player.invincible = 90;
        if (lives <= 0) gameOver();
        break;
      }
    }
  }

  // offscreen enemies
  enemies = enemies.filter(e => e.y < H + 100);

  // explosions
  for (const ex of explosions) ex.update();
  explosions = explosions.filter(ex => !ex.dead);

  // high score
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('planeWarHigh', highScore);
    elHigh.textContent = highScore;
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // bg gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0a2e'); bg.addColorStop(0.5, '#0d0d3a'); bg.addColorStop(1, '#050520');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  for (const s of stars) s.draw();
  for (const b of bullets) b.draw();
  for (const e of enemies) e.draw();
  player.draw();
  for (const ex of explosions) ex.draw();
}

function gameOver() {
  gameRunning = false;
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = '💥 游戏结束';
  overlay.querySelector('p').textContent = `最终得分: ${score}`;
  startBtn.textContent = '再来一局';
  canvas.style.cursor = 'default';
  if (mouseX === undefined) mouseX = W / 2;
  if (mouseY === undefined) mouseY = H - 120;
}

function gameLoop() {
  if (gameRunning) update();
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  init();
  gameRunning = true;
  overlay.classList.add('hidden');
  canvas.style.cursor = 'none';
  mouseX = W / 2;
  mouseY = H - 120;
}

startBtn.addEventListener('click', startGame);

canvas.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') mouseX = Math.max(0, (mouseX || W / 2) - 20);
  if (e.key === 'ArrowRight') mouseX = Math.min(W, (mouseX || W / 2) + 20);
  if (e.key === 'ArrowUp') mouseY = Math.max(0, (mouseY || H - 120) - 20);
  if (e.key === 'ArrowDown') mouseY = Math.min(H, (mouseY || H - 120) + 20);
  if (e.key === ' ' && !gameRunning) startGame();
});

// init and start
init();
gameRunning = false;
canvas.style.cursor = 'default';
mouseX = W / 2;
mouseY = H - 120;
gameLoop();
</script>
</body>
</html>
